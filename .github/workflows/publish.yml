name: Build and push Docker Hub

on:
  push:
    branches: ["main", "dev-build"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Install rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - name: Lint
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test

      - name: build the binary
        run: cargo build --release --bin waddle-ws

      - name: Build image
        id: build
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ secrets.DOCKERHUB_USERNAME }}/waddle-ws
          tags: |
            latest
            ${{ steps.vars.outputs.sha_short }}
          containerfiles: ./Dockerfile

      - name: Push
        uses: redhat-actions/push-to-registry@v2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}

      - name: Install hurl
        run: |
          curl -fsSL https://github.com/Orange-OpenSource/hurl/releases/latest/download/hurl_amd64.deb -o hurl.deb
          sudo dpkg -i hurl.deb

      - name: Start stack
        run: docker compose up -d

      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/api/transactions && break || sleep 1
          done

      - name: Run E2E tests
        run: hurl --test tests/e2e/*.hurl --variable host=http://localhost:8080

      - name: Tear down
        run: docker compose down
