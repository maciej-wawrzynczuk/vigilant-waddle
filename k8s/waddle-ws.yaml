apiVersion: apps/v1
kind: Deployment
metadata:
  name: waddle-ws
  namespace: waddle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: waddle-ws
  template:
    metadata:
      labels:
        app: waddle-ws
    spec:
      volumes:
        - name: stooq-symbol-map
          configMap:
            name: stooq-symbol-map
      containers:
        - name: waddle-ws
          image: localhost/waddle-ws:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: WADDLE_LISTEN_ADDR
              value: "0.0.0.0:3000"
            - name: RUST_LOG
              value: info
            - name: WADDLE_QUOTES_PROVIDER
              value: stooq
            - name: STOOQ_SYMBOL_MAP
              value: /etc/waddle/stooq-symbol-map.toml
          volumeMounts:
            - name: stooq-symbol-map
              mountPath: /etc/waddle
              readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: waddle-ws
  namespace: waddle
spec:
  selector:
    app: waddle-ws
  ports:
    - port: 3000
      targetPort: 3000
