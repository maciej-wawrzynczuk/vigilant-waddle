apiVersion: apps/v1
kind: Deployment
metadata:
  name: waddle-frontend
  namespace: waddle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: waddle-frontend
  template:
    metadata:
      labels:
        app: waddle-frontend
    spec:
      containers:
        - name: waddle-frontend
          image: localhost/waddle-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: waddle-frontend
  namespace: waddle
spec:
  type: NodePort
  selector:
    app: waddle-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
