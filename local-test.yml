---
- name: Local test deployment
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Build waddle-ws image
      tags: [build]
      containers.podman.podman_image:
        name: waddle-ws
        tag: local
        path: .
        build:
          file: Dockerfile

    - name: Build nginx-frontend image
      tags: [build]
      containers.podman.podman_image:
        name: nginx-frontend
        tag: local
        path: .
        build:
          file: Dockerfile.nginx

    - name: Create waddle-test-pod
      tags: [deploy, build]
      containers.podman.podman_pod:
        name: waddle-test-pod
        state: started
        ports:
          - "8080:80"

    - name: Start waddle-ws container
      tags: [deploy, build]
      containers.podman.podman_container:
        name: waddle-ws
        image: waddle-ws:local
        state: started
        pod: waddle-test-pod
        env:
          WADDLE_LISTEN_PORT: "127.0.0.1:3000"
          RUST_LOG: info

    - name: Start nginx-frontend container
      tags: [deploy, build]
      containers.podman.podman_container:
        name: nginx-frontend
        image: nginx-frontend:local
        state: started
        pod: waddle-test-pod

    - name: Wait for backend health
      tags: [deploy]
      ansible.builtin.uri:
        url: http://localhost:8080/api/transactions
        method: GET
        status_code: [200, 404]
      register: result
      until: result is not failed
      retries: 10
      delay: 2

    - name: Run integration tests
      tags: [test, deploy]
      ansible.builtin.command:
        cmd: hurl --test tests/integration/*.hurl --variable host=http://localhost:8080
      changed_when: false
