[package]
name = "vigilant-waddle"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "waddle"
path = "src/main.rs"

[[bin]]
name = "waddle-ws"
path = "src/ws.rs"

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.8", features = ["multipart"] }
chrono = { version = "0.4.43", features = ["serde"] }
clap = { version = "4.5.54", features = ["derive"] }
csv = "1.4.0"
env_logger = "0.11.8"
http = "1.4.0"
indoc = "2.0.7"
log = "0.4.29"
polars = { version = "0.52.0", features = ["csv"] }
reqwest = "0.13.1"
rust_decimal = "1.40.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["full"] }
tower-http = { version = "0.6.8", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "registry"] }
url = "2.5.8"
