version: "3.8"

services:
  waddle-ws:
    image: maciekw/waddle-ws:latest
    environment:
      - WADDLE_LISTEN_PORT=0.0.0.0:3000
      - RUST_LOG=info
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - waddle-ws
