server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /transactions {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_pass http://waddle-ws:3000;
    }

    location /portfolio {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_pass http://waddle-ws:3000;
    }
}
