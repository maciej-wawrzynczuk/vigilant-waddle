<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waddle Transactions</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }
        h1 { color: #333; }
        .upload-section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 8px;
        }
        input[type="file"] { margin-right: 10px; }
        button {
            padding: 8px 16px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background: #0056b3; }
        #status {
            margin-top: 10px;
            padding: 10px;
            border-radius: 4px;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        th { background: #007bff; color: white; }
        tr:nth-child(even) { background: #f9f9f9; }
        tr:hover { background: #f1f1f1; }
    </style>
</head>
<body>
    <h1>Waddle Transactions</h1>

    <div class="upload-section">
        <h2>Upload CSV</h2>
        <input type="file" id="csvFile" accept=".csv">
        <button onclick="uploadFile()">Upload</button>
        <button onclick="loadTransactions()">Refresh</button>
        <div id="status"></div>
    </div>

    <h2>Transactions</h2>
    <table id="transactionsTable">
        <thead>
            <tr>
                <th>Date</th>
                <th>Symbol</th>
                <th>Number</th>
                <th>Price</th>
                <th>Commission</th>
                <th>Currency</th>
            </tr>
        </thead>
        <tbody id="tableBody">
        </tbody>
    </table>

    <script>
        async function uploadFile() {
            const fileInput = document.getElementById('csvFile');
            const status = document.getElementById('status');

            if (!fileInput.files[0]) {
                status.textContent = 'Please select a file';
                status.className = 'error';
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            try {
                const response = await fetch('/api/transactions', {
                    method: 'PUT',
                    body: formData
                });
                const text = await response.text();

                if (response.ok) {
                    status.textContent = text;
                    status.className = 'success';
                    loadTransactions();
                } else {
                    status.textContent = 'Error: ' + text;
                    status.className = 'error';
                }
            } catch (err) {
                status.textContent = 'Error: ' + err.message;
                status.className = 'error';
            }
        }

        async function loadTransactions() {
            const tableBody = document.getElementById('tableBody');
            const status = document.getElementById('status');

            try {
                const response = await fetch('/api/transactions');

                if (response.status === 404) {
                    tableBody.innerHTML = '<tr><td colspan="6">No transactions uploaded</td></tr>';
                    return;
                }

                if (!response.ok) {
                    throw new Error(await response.text());
                }

                const data = await response.json();
                tableBody.innerHTML = '';

                if (data.p.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="6">No transactions</td></tr>';
                    return;
                }

                data.p.forEach(t => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${t.date}</td>
                        <td>${t.symbol}</td>
                        <td>${t.number}</td>
                        <td>${t.price}</td>
                        <td>${t.commision}</td>
                        <td>${t.currency}</td>
                    `;
                    tableBody.appendChild(row);
                });
            } catch (err) {
                status.textContent = 'Error loading: ' + err.message;
                status.className = 'error';
            }
        }

        // Load on page load
        loadTransactions();
    </script>
</body>
</html>
