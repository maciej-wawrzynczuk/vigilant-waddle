# vim: ft=yaml.ansible
---
- name: Waddle playbook
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    test_image: "localhost/waddle-test"
    ws_image: "localhost/waddle-ws:latest"
    frontend_image: "localhost/waddle-frontend:latest"

  tasks:
    - name: Build release binary
      ansible.builtin.command: cargo build --bin waddle-ws
      changed_when: true
      tags: [build, e2e]

    - name: Build test image
      community.docker.docker_image_build:
        name: "{{ test_image }}"
        path: "{{ playbook_dir }}"
        rebuild: always
      tags: [build, e2e]

    - name: Run e2e tests
      tags: [e2e]
      block:
        - name: Spin up the container
          community.docker.docker_container:
            image: "{{ test_image }}"
            name: "test_waddle"
            ports:
              - 3000:3000
            env:
              WADDLE_QUOTES_PROVIDER: mock

        - name: Wait for the service
          ansible.builtin.wait_for:
            host: localhost
            port: 3000
            timeout: 10

        - name: Test with hurl
          ansible.builtin.command: >-
            hurl --test --jobs 1
            hurl/empty_transactions.hurl
            hurl/overwrite_rejected.hurl
            hurl/trans.hurl
            hurl/portfolio.hurl
          changed_when: false

      always:
        - name: Cleanup
          community.docker.docker_container:
            name: "test_waddle"
            state: absent

    - name: Build waddle-ws image for k8s
      community.docker.docker_image_build:
        name: "{{ ws_image }}"
        path: "{{ playbook_dir }}"
        rebuild: always
      tags: [k8s]

    - name: Build frontend image
      community.docker.docker_image_build:
        name: "{{ frontend_image }}"
        path: "{{ playbook_dir }}"
        dockerfile: Dockerfile.frontend
        rebuild: always
      tags: [k8s]

    - name: Load waddle-ws image into kind
      ansible.builtin.command: kind load docker-image {{ ws_image }}
      changed_when: true
      tags: [k8s]

    - name: Load frontend image into kind
      ansible.builtin.command: kind load docker-image {{ frontend_image }}
      changed_when: true
      tags: [k8s]

    - name: Apply k8s namespace
      kubernetes.core.k8s:
        src: "{{ playbook_dir }}/k8s/namespace.yaml"
        state: present
      tags: [k8s]

    - name: Wait for namespace to be active
      kubernetes.core.k8s_info:
        kind: Namespace
        name: waddle
      register: ns_info
      until: ns_info.resources | length > 0 and ns_info.resources[0].status.phase == "Active"
      retries: 20
      delay: 3
      tags: [k8s]

    - name: Apply stooq ConfigMap
      kubernetes.core.k8s:
        src: "{{ playbook_dir }}/k8s/stooq-configmap.yaml"
        state: present
      tags: [k8s]

    - name: Apply k8s manifests
      kubernetes.core.k8s:
        src: "{{ item }}"
        state: present
      loop:
        - "{{ playbook_dir }}/k8s/waddle-ws.yaml"
        - "{{ playbook_dir }}/k8s/frontend.yaml"
      tags: [k8s]

    - name: Wait for waddle-ws rollout
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: waddle-ws
        namespace: waddle
        wait: true
        wait_condition:
          type: Available
          status: "True"
        wait_sleep: 3
        wait_timeout: 60
      tags: [k8s]

    - name: Wait for waddle-frontend rollout
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: waddle-frontend
        namespace: waddle
        wait: true
        wait_condition:
          type: Available
          status: "True"
        wait_sleep: 3
        wait_timeout: 60
      tags: [k8s]

    - name: Destroy k8s
      kubernetes.core.k8s:
        name: waddle
        kind: namespace
        state: absent
        api_version: v1
        wait: true
        wait_timeout: 120
      tags: [k8s_destroy]
