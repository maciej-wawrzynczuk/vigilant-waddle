# vim: ft=yaml.ansible
---
- name: A test
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    test_image: "localhost/waddle-test"

  tasks:
    - name: Build release binary
      ansible.builtin.command: cargo build --bin waddle-ws
      changed_when: true

    - name: Build image
      community.docker.docker_image_build:
        name: "{{ test_image }}"
        path: "{{ playbook_dir }}"
        rebuild: always

    - name: Run an test
      block:
        - name: Spin up the container
          community.docker.docker_container:
            image: "{{ test_image }}"
            name: "test_waddle"
            ports:
              - 3000:3000

        - name: Wait for the service
          ansible.builtin.wait_for:
            host: localhost
            port: 3000
            timeout: 10

        - name: Test with hurl
          ansible.builtin.command: hurl --test hurl/
          changed_when: false

      always:
        - name: Cleanup
          community.docker.docker_container:
            name: "test_waddle"
            state: absent
